# Configuration for the UCL pandemic-response timeline.
#
# Every setting here is overridable, with the precedence
#     command line  >  environment  >  this file  >  built-in default
# Environment variables take the prefix UCLTL_ and the dotted path upper-cased
# with dots as underscores, e.g. paths.archive -> UCLTL_PATHS_ARCHIVE.

[paths]
# The archive repository, relative to this file's parent directory.
archive = "../home/uclcovid"
# Preserved newsletters and their source-URL manifest.
updates = "../home/uclcovid/data/updates"
# The published case series, unsmoothed.
cases = "../home/uclcovid/data/covid_raw.csv"
# The research synthesis, with citation markers restored.
resources = "../UK COVID-19 Timeline Resources.md"

# Everything below is written by the build, not read from the archive.
text = "text"
data = "data"
ledger = "timeline.csv"
progress = "PROGRESS.md"
markdown_out = "TIMELINE.md"
html_out = "timeline.html"

[range]
# The ledger's admissible date window. Rows outside it fail validation.
start = "2020-01-01"
end = "2022-12-31"

[extract]
# Characters of extracted text searched for the newsletter's own date line.
date_window = 1200

[data_track]
# A month enters the data track when a group's total moves by at least this
# fraction from the previous month, and by at least this absolute count. Both
# gates must pass, so that a jump from 2 cases to 6 does not register as a
# 200% surge.
month_change_fraction = 0.5
month_change_absolute = 25
# The UCL series is reported weekly; comparisons align on weeks ending Tuesday,
# which is the day the seven-day totals were published.
week_ends = "Tuesday"

[camden]
# The local comparator. Fetched once by build/fetch_camden.py and cached; no
# renderer may fetch at run time. See TIMELINE-PLAN.md section 2b.
base = "https://api.ukhsa-dashboard.data.gov.uk"
theme = "infectious_disease"
sub_theme = "respiratory"
topic = "COVID-19"
geography_type = "Lower Tier Local Authority"
geography = "Camden"
metric = "COVID-19_cases_casesByDay"
page_size = 365
cache = "data/camden-cases.csv"

[sources]
# Primary documents cached once by build/fetch_sources.py and verified against
# thereafter. The numbers are references in the works-cited list of the
# research synthesis, chosen by how many dated claims rest on each: 7 and 11
# are the two Institute for Government timelines and carry most of the
# restriction dates, 9 and 6 are the Commons Library briefings, and 57, 49 and
# 38 are the higher-education-specific documents.
retrieve = [7, 11, 9, 6, 57, 49, 38]
cache = "sources"

# Primary documents that are not in the research synthesis' works-cited list.
# Stage 2 seeds from that list, but the list is a secondary source's choice of
# references and it does not carry everything the ledger needs: the lag
# pairings turned up national measures the synthesis never dates. These are
# numbered from 101 so they cannot collide with a reference number, and they
# are fetched and verified by exactly the same path.
[[extra_sources]]
id = 101
url = "https://www.legislation.gov.uk/uksi/2020/592/made"
title = "The Health Protection (Coronavirus, Wearing of Face Coverings on Public Transport) (England) Regulations 2020"

[markdown]
# Where TIMELINE.md points when it cites a newsletter.
#
# This repository is published on its own, so a path relative to the rendered
# file has nothing to reach: the newsletters live in the archive repository,
# not this one. Citing them at their public URL is what makes the 283 links
# followable by a reader who has only the published page — which the document's
# own AI-generated notice tells them to do before trusting anything in it.
#
# For a local build against a checkout of the archive, override without editing
# anything tracked:
#
#   UCLTL_MARKDOWN_SOURCE_PREFIX=../home/uclcovid/data/updates/ ...
#   python3 build/render_md.py --set markdown.source_prefix=../home/uclcovid/data/updates/
#
# `blob/main` shows each newsletter as source. The archive also serves them
# rendered at https://sjmurdoch.github.io/uclcovid/data/updates/, which reads
# far better but depends on Pages staying enabled there.
source_prefix = "https://github.com/sjmurdoch/uclcovid/blob/main/data/updates/"

# Pandemic phases used to section the Markdown chronology. These are a
# judgement call and belong in a config file rather than a renderer. Dates are
# inclusive starts; each phase runs to the day before the next.
#
# The phases section TIMELINE.md only. The chart shades its background by the
# restriction regimes below instead: a reader cannot infer "phase 4" from a
# grey band, whereas "was there a lockdown on this date, and how strict" is a
# question the shading can answer on its own.
# The `framing` fields are the only prose in TIMELINE.md that the ledger does
# not supply, so every factual claim in one has to be checkable against the
# rows of the phase it introduces. They are wrapped here for legibility and
# rendered as a single line, per the Markdown convention for paragraphs.

[[phases]]
name = "First wave and the first lockdown"
start = "2020-01-01"
framing = """
UCL's response opens on 9 March 2020 with a mitigation group meeting daily
across fifteen strands of activity and a campus still open on Public Health
England's advice, and arrives fourteen days later at a national lockdown with
the buildings shut and the institution working from home. This is the densest
concentration of events in the whole record, carried by a newsletter that
appeared almost every weekday. Two of them fix the shape of the lag analysis:
face-to-face teaching ceased on 13 March, ten days before the national
lockdown, and staff were barred from campus on 24 March, one day after it.
"""

[[phases]]
name = "Summer easing"
start = "2020-07-04"
framing = """
With the campus closed and the term over, UCL spent the summer deciding how
much of it to reopen and on what terms. The decision that mattered most was
taken on 8 July: the Prime Minister had announced a relaxing of the 2 metre
distancing rule on 23 June, and fifteen days later UCL confirmed it would keep
a 2 metre guideline for Term 1 timetable planning anyway, a divergence that set
room capacities for the whole of the autumn and so determined how many people
were on campus once the case counting began in October. Face coverings became
mandatory across campus on 10 July, ahead of the national requirement in shops
that UCL recorded on 24 July, and the newsletter dropped from daily to twice
weekly at issue 100 on 3 August.
"""

[[phases]]
name = "Autumn resurgence and tiering"
start = "2020-09-01"
framing = """
Term 1 began on 28 September with students back in London and UCL still holding
no measurements of its own. That changes on 12 October, when UCL published a
webpage of confirmed cases among staff and students, fixed the case definition
that governs every figure in the dataset, and moved the newsletter to a weekly
Monday cadence; testing is the largest single category of decision in this
phase. The second national lockdown did not close the university, and the
Provost's observation that universities were meant to stay open this time is
the single sentence that explains why the case series behaves so differently in
the two lockdowns.
"""

[[phases]]
name = "Winter, Alpha and the second closure"
start = "2020-12-19"
framing = """
The thinnest stretch of the record for institutional decisions, set against
case-data readings that move very sharply: staff cases off campus
rise from 15 in December 2020 to 154 in January 2021 and fall back to 18 in
February. UCL responded to the third national lockdown on 5 January by
returning to work from home, and on 1 February moved all remaining teaching
online for the rest of Term 2, a decision the newsletter attributes explicitly
to government guidance rather than to UCL's own figures. On-campus student
cases in January 2021 totalled nine, and that is the number the January 2022
comparison is measured against.
"""

[[phases]]
name = "The roadmap out of lockdown"
start = "2021-02-22"
framing = """
Practical and practice-based teaching resumed on campus on 8 March 2021, and on
23 March UCL published its own roadmap tracking the government's four steps,
which is the plainest instance in the record of an institutional timetable
written as a function of a national one. Remaining students were told on 21
April to stay away until in-person teaching resumed, which they did on 17 May,
and that instruction is why the on-campus line stays flat through the spring
while national restrictions were easing. The single case-data reading in this
phase is on-campus student cases rising from 1 in May 2021 to 54 in June.
"""

[[phases]]
name = "Delta and the summer reopening"
start = "2021-06-14"
framing = """
Step 4 was delayed by four weeks on 14 June and UCL's return timetable slipped
with it, which is the clearest case in the record of a UCL date moving purely
because a national date moved. When the remaining legal restrictions ended, UCL
kept face coverings in all indoor spaces, reviewed that policy on 31 August and
again on 22 October, and deliberately kept it both times: a second divergence
in the cautious direction, a year after the 2 metre decision. The limit of that
autonomy is recorded on 14 September, when the Department for Education's
position that students may decline a face covering left UCL holding an
expectation it could not enforce.
"""

[[phases]]
name = "Omicron"
start = "2021-11-27"
framing = """
This is the phase in which UCL acts on its own case data rather than on
national policy. The newsletter of 13 December states that cases were rising on
campus as well as nationally, and the on-campus student series peaks at 525 in
the week to 21 December, the highest seven-day total anywhere in the record,
with on-campus staff peaking at 131 in the same week. Higher education was
exempted from Plan B and the campus stayed open, which sets up the sharpest
measurement in the dataset: 9 on-campus student cases in January 2021 against
696 in January 2022, a 77-fold rise, while Camden's own cases rose 2.4-fold
across the same two months. Both series rise, and it is the difference in
magnitude rather than in direction that the local epidemic cannot account for.
"""

[[phases]]
name = "Living with COVID"
start = "2022-02-21"
framing = """
UCL narrowed its face covering expectation to teaching settings on 21 February
2022, and on-campus staff cases then rose from 142 in February to 339 in March,
the last increase anywhere in the record. The final issue of 4 May 2022
withdrew the remaining expectations, closed the COVID-19 telephone helpline and
dropped the twice-weekly testing advice as free national testing ended. The
published series stops a week later on 11 May 2022, so the record closes
because the counting stopped rather than because the pandemic did.
"""

# ---------------------------------------------------------------------------
# Restriction regimes: the background shading of the chart.
#
# What was legally in force in England, and in London specifically wherever
# England was tiered, since UCL is in Camden. Dates are the days measures came
# into force, not the days they were announced: the shading answers "what were
# the rules on this date", and the announcement is already an event mark on the
# National lane a few days to its left. The gap between the two is the subject
# of the lag pairings below, so encoding announcements here would put the same
# fact in the chart twice and blur the one measurement the archive is for.
#
# `level` is ordinal, 0-3, and is the only thing the shading encodes:
#
#   0  no legal restrictions
#   1  limited measures, everything open (face coverings, gathering limits)
#   2  substantial restrictions short of a stay-at-home order (tiers, closures)
#   3  a stay-at-home order in force
#
# One entry per run of a level, not per announcement. Successive regimes at the
# same strictness are merged, because a boundary drawn where the shading does
# not change reads as a change that is not there; the regimes that make up a
# merged span are named in `name` and their events are on the lanes anyway.
#
# `level = 3` is the legal test — a stay-at-home order — and not a measure of
# how closed the university was. The second national lockdown scores 3 while
# UCL stayed open, which is the divergence the record exists to show, so the
# shading must not quietly absorb it.
#
# `source` records where each start date comes from. Three are not backed by a
# row of the ledger and are marked `checked = false`: they come from the general
# England chronology rather than from a cited archive source, and want checking
# against the regulations before this is published.
#
# `wikipedia` records a check of every span against
# https://en.wikipedia.org/wiki/COVID-19_lockdown_in_the_United_Kingdom,
# read 26 July 2026. It corroborates six spans, is silent on six, and differs
# from the ledger on none of the shading boundaries. `checked` deliberately does
# not move on the strength of it: that flag means a source this archive holds
# and can re-verify, and a tertiary article at a live URL is the thing this
# project exists to distrust. Two things the check turned up are worth carrying:
#
#   * 13 May 2020 is corroborated in the article's own words, which is the
#     first external support this date has had. It stays `checked = false` until the
#     regulation itself is in `sources/`, but it is no longer unsupported.
#   * The article puts the third national lockdown's legal effect at 00:01 on
#     5 January 2021, where the ledger's cited row says 6 January. Nothing in
#     the shading turns on it — level 3 runs unbroken from 20 December — but the
#     ledger row is worth re-reading against its source.
#
# The article's scope ends in May 2021, so it can say nothing about step 4,
# Plan B, or the end of the requirement in 2022. Those three rest on the
# ledger, which cites primary documents for all of them.

[[restrictions]]
start = "2020-01-01"
level = 0
label = "No restrictions"
name = "No legal restrictions"
source = "Start of the ledger's date window."
checked = true
wikipedia = "Out of scope: the article opens with the March 2020 lockdown."

[[restrictions]]
start = "2020-03-26"
level = 3
label = "Lockdown 1"
name = "First national lockdown"
source = "Ledger, national/restrictions, 2020-03-26 effective: the first lockdown measures come into force."
checked = true
wikipedia = "Confirms: legally effective from 1:00 p.m. on 26 March 2020."

[[restrictions]]
start = "2020-05-13"
level = 2
name = "First easing: the stay-at-home order replaced"
label = "Easing"
source = "England chronology: the stay-at-home regulation was replaced on 13 May 2020. The ledger has only the announcement of the conditional plan, 2020-05-10, and the resources synthesis dates the easing loosely to June."
checked = false
wikipedia = "Confirms: on 13 May 2020, those in England were allowed to meet one other person not from their household outside whilst maintaining a 2-metre social distance. Corroborates a date the ledger does not carry."

[[restrictions]]
start = "2020-07-04"
level = 1
label = "Summer"
name = "Summer easing, then the rule of six and face coverings"
source = "Ledger, national/restrictions, 2020-07-04 effective, whose quotation reads: more restrictions are eased in England, including reopening of pubs, restaurants, hairdressers."
checked = true
wikipedia = "Confirms: by 4 July most other businesses were allowed to reopen, with the two-metre rule relaxed to one metre."

[[restrictions]]
start = "2020-10-14"
level = 2
label = "Tiers"
name = "Three-tier system, London in Tier 2 from 17 October"
source = "Ledger, national/restrictions, 2020-10-14 effective: a three-tier system of restrictions starts in England."
checked = true
wikipedia = "Partly: gives London moving to Tier 2 from 17 October 2020, which is the detail this span already names. Silent on 14 October as the start of the tier system, which the ledger carries."

[[restrictions]]
start = "2020-11-05"
level = 3
label = "Lockdown 2"
name = "Second national lockdown, with universities open"
source = "Ledger, national/restrictions, 2020-11-05 effective: the second national lockdown comes into force in England."
checked = true
wikipedia = "Confirms: a partial lockdown would commence in England from 5 November 2020, to last for 4 weeks up to and including 2 December."

[[restrictions]]
start = "2020-12-02"
level = 2
label = "Tiers"
name = "Tiers return, London in Tier 2"
source = "Ledger, national/restrictions, 2020-12-02 effective: the second lockdown ends and England returns to the tier system."
checked = true
wikipedia = "Confirms, in the same sentence: the second lockdown ran up to and including 2 December."

[[restrictions]]
start = "2020-12-20"
level = 3
label = "Lockdown 3"
name = "Tier 4 in London, then the third national lockdown"
source = "Announcement is in the ledger at 2020-12-19; Tier 4 came into force in London the following day. The third national lockdown of 2021-01-06 continues the same level and so does not open a span of its own."
checked = false
wikipedia = "Silent: mentions that a stricter Tier 4 was introduced for London and around it, with no date. This date is still unsupported. Note also that the article dates the third national lockdown to 00:01 on 5 January 2021 against the ledger's 6 January; the shading does not turn on it, since level 3 runs unbroken from here."

[[restrictions]]
start = "2021-03-29"
level = 2
label = "Steps 1-2"
name = "Roadmap steps 1 and 2, after the stay-at-home rule ended"
source = "England chronology: the stay-at-home rule ended on 29 March 2021. Not in the ledger, which has the roadmap's publication on 2021-02-22 and step 1 on 2021-03-08."
checked = false
wikipedia = "Silent: the article gives step 1 as 8 March, step 2 as 12 April and step 3 as 17 May, and states no date for the end of the stay-at-home rule. It neither supports nor contradicts this boundary, which remains the weakest date here."

[[restrictions]]
start = "2021-05-17"
level = 1
label = "Step 3"
name = "Roadmap step 3: indoor mixing resumes"
source = "Resources synthesis: Step 3, commencing on 17 May, saw the resumption of indoor mixing under the rule of six."
checked = true
wikipedia = "Confirms: the third step, which allowed for limited indoor mixing and the reopening of indoor hospitality venues, took effect on Monday 17 May."

[[restrictions]]
start = "2021-07-19"
level = 0
label = "Step 4"
name = "Step 4: most legal limits removed"
source = "Ledger, national/restrictions, 2021-07-19 effective: step 4 removes most legal limits on social contact in England."
checked = true
wikipedia = "Out of scope: the article ends at step 3, May 2021."

[[restrictions]]
start = "2021-12-10"
level = 1
label = "Plan B"
name = "Plan B: face coverings compulsory indoors"
source = "Ledger, national/restrictions, 2021-12-10 effective: face masks become compulsory in most indoor venues under Plan B."
checked = true
wikipedia = "Out of scope: the article does not cover Plan B."

[[restrictions]]
start = "2022-01-27"
level = 0
label = "No restrictions"
name = "No legal restrictions"
source = "Ledger, national/restrictions, 2022-01-26 effective, whose detail records that the requirement lapses at the end of 26 January 2022."
checked = true
wikipedia = "Out of scope: the article does not cover the end of the requirement in 2022."

# The legend for the shading. Ordinal, so the wording has to read as a scale
# and not as four unrelated states.
[[restriction_levels]]
level = 0
name = "No legal restrictions"

[[restriction_levels]]
level = 1
name = "Limited measures"

[[restriction_levels]]
level = 2
name = "Substantial restrictions"

[[restriction_levels]]
level = 3
name = "Stay-at-home lockdown"

# ---------------------------------------------------------------------------
# Lag pairings.
#
# Where a UCL action responds to a national or sector one, the two are declared
# here and render_md.py computes the gap in days between them. The pairing is
# declared rather than inferred: matching a UCL row to the nearest national row
# by date and category would manufacture correspondences that nobody has
# checked, and a lag is a factual claim about cause.
#
# `ucl` names the ledger row by date and headline, which validate.py has
# already established are unique together. `counterpart` is the date of the
# national or sector event, and is deliberately OPTIONAL: several of these are
# pairings where the newsletter makes the dependency plain without dating the
# measure it responds to, and a date is not invented for them here. `label` is
# what stage 2 must go and find.
#
# Every dated counterpart below is a date the newsletters themselves assert, so
# each is UCL's account of national policy rather than the policy itself. Until
# stage 2 retrieves the primary source and puts a `national` or `sector` row in
# the ledger, these render as a worklist and no lag is computed from them.
# ---------------------------------------------------------------------------

[[links]]
ucl = "2020-03-13|Face-to-face teaching ceases; teaching moves online from 16 March"
counterpart = "2020-03-23"
label = "The first national lockdown is announced"
note = "The clearest case of UCL acting ahead of national policy."

